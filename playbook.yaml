---
- name: Установка Open5GS
  hosts: localhost
  become: yes
  vars_files:
    - vars.yaml
  
  # основная часть

  tasks:
    # MongoDB
    - name: Установка необходимых пакетов
      apt:
        name:
          - gnupg
          - curl
          - ca-certificates
        state: present
        update_cache: yes
    
    - name: Добавление ключа mangodb
      shell: |
        curl -fsSL https://pgp.mongodb.com/server-8.0.asc | sudo gpg -o /usr/share/keyrings/mongodb-server-8.0.gpg --dearmor
      args:
        creates: "/usr/share/keyrings/mongodb-server-8.0.gpg"

    - name: Добавление репозитория mangodb
      apt_repository:
        repo: "deb [ arch=amd64,arm64 signed-by=/usr/share/keyrings/mongodb-server-8.0.gpg] https://repo.mongodb.org/apt/ubuntu jammy/mongodb-org/8.0 multiverse"
        state: present
        filename: mongodb-org

    - name: Установка MongoDB
      apt:
        name: mongodb-org
        state: present
        update_cache: yes

    - name: Запуск и включение MongoDB
      systemd:
        name: mongod
        state: started
        enabled: yes
    
    # open5GS

    - name: Добавление репозитория Open5GS
      apt_repository:
        repo: ppa:open5gs/latest
        state: present

    - name: Установка Open5GS
      apt:
        name: open5gs
        state: present
        update_cache: yes

    # Download and import the Nodesource GPG key
    
    - name: Добавление ключа 
      shell: |
        sudo mkdir -p /etc/apt/keyrings
        curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key | sudo gpg --dearmor -o /etc/apt/keyrings/nodesource.gpg
      args:
        creates: /etc/apt/keyrings/nodesource.gpg
    
    # nodejs

    - name: Добавление репозитория nodejs
      apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_20.x nodistro main"
        state: present
        filename: nodesource

    - name: Установка nodejs
      apt:
        name:
          - nodejs
        state: present
        update_cache: yes

    - name: Установка WebUI Open5GS
      shell: |
        curl -fsSL https://open5gs.org/open5gs/assets/webui/install | bash -
      args:
        creates: /opt/open5gs/webui
    
    # UHD
    - name: Установка UHD
      apt:
        name:
          - uhd-host
          - libuhd-dev
        state: present
    
    